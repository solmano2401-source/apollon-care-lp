<style>
:root{--bg:#FFF8EC;--card:#FFFDF8;--line:#EADCC4;--ink:#3B2A1E;--body:#5B4636;--muted:#7A6352;--sun:#E06A0A;--gold:#FFC94A;--line-green:#06C755;--r:22px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Zen Maru Gothic',"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;font-weight:500;color:var(--ink);background:var(--bg);line-height:1.8;font-size:16px;-webkit-font-smoothing:antialiased}
img{max-width:100%;height:auto;display:block}
a{color:inherit;text-decoration:none}
.wrap{max-width:640px;margin:0 auto;padding:48px 20px 64px}
.card{background:var(--card);border:2px solid var(--sun);border-radius:var(--r);padding:32px 22px;text-align:center}
.card img{width:140px;margin:0 auto 12px}
h1{font-size:1.45rem;font-weight:900;line-height:1.4;margin-bottom:12px}
p{color:var(--body);text-align:left}
.acts{display:grid;gap:12px;margin-top:22px}
.btn{display:flex;align-items:center;justify-content:center;border-radius:999px;font-weight:900;padding:16px 24px;font-size:1.02rem;line-height:1.35;text-align:center}
.btn-gold{background:var(--gold);color:var(--ink)}
.btn-req{background:var(--sun);color:#fff;box-shadow:0 8px 22px rgba(224,106,10,.35)}
.btn-ghost{border:2px solid var(--line);color:var(--muted)}
.note{font-size:.82rem;color:var(--muted);margin-top:18px;text-align:center}
.foot{font-size:.8rem;color:var(--muted);text-align:center;margin-top:28px}
</style>

<body>
<main class="wrap">
  <div class="card">
    <img src="assets/lp/mascot-ok.webp" alt="OKサインをするアポロン君">
    <h1>お申し込みありがとうございます</h1>
    <p>ご入力のメールアドレスに、資料と事業説明（オンライン30分）の予約リンクをお送りしました。下のボタンからすぐに資料を見たり、日程を選んだりすることもできます。届かない場合は迷惑メールフォルダもご確認ください。</p>
    <div class="acts">
      <a class="btn btn-gold" href="apollon-care-fc-guide.pdf" target="_blank" rel="noopener">加盟説明資料を今すぐ見る（PDF）</a>
      <a class="btn btn-gold" href="apollon-care-simulation.pdf" target="_blank" rel="noopener">収支シミュレーションを見る（PDF）</a>
      <a class="btn btn-req" href="https://calendar.google.com/calendar/appointments/schedules/AcZssZ2LKufrku6lGS-IvxS71JYY_TBqPpoZv8UEtQYe6Li1SBZBEZLmx512vj4wRYg2CnI52Iw_P5LZ" target="_blank" rel="noopener">事業説明（30分）の日程を選ぶ</a>
      <a class="btn btn-ghost" href="./">加盟募集ページに戻る</a>
    </div>
    <p class="note">資料内の数値は一定条件によるシミュレーションであり、収益を保証するものではありません。</p>
  </div>
  <p class="foot">株式会社solmano｜訪問介護フランチャイズ アポロンケア</p>
</main>
